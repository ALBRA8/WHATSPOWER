name: CI WHATSPOWER
on:
  push:
    branches: [main, 'impl/**', 'repair/**', 'fix/**']
  pull_request:
    branches: [main, 'impl/**', 'repair/**', 'fix/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript (fail-fast)
        run: npm install --no-save typescript@5 @types/node@24 && npx tsc --noEmit -p tsconfig.json
      - name: Suite completa (incluye seguridad AUTH/WH/ENV/TR/IDEM + contrato v1.1.0)
        run: npm test
        env:
          NODE_ENV: test
          INTERNAL_API_SECRET: ci-only-wp-internal-secret-000000000000
